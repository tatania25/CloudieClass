<script>
/* CloudieClass standalone shim: menggantikan claude.use(...) agar jalan di Vercel/GitHub Pages.
   Mode 1 (default): data disimpan di localStorage browser (hanya di perangkat ini).
   Mode 2: isi FIREBASE_CONFIG di bawah agar data tersimpan online dan dibagi ke semua perangkat. */
window.FIREBASE_CONFIG = null;
/* contoh:
window.FIREBASE_CONFIG = {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."};
*/
(function(){
 const PFX='cc-db-';
 function localDB(){
  const subs={};
  const read=c=>{try{return JSON.parse(localStorage.getItem(PFX+c)||'{}')}catch(e){return{}}};
  const write=(c,o)=>{localStorage.setItem(PFX+c,JSON.stringify(o))};
  const emit=c=>{const o=read(c),snap={docs:Object.keys(o).map(id=>({id,data:()=>o[id]}))};(subs[c]||[]).forEach(f=>{try{f(snap)}catch(e){console.error(e)}})};
  window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith(PFX))emit(e.key.slice(PFX.length))});
  return{collection:c=>({
   doc:id=>({
    set:async o=>{const m=read(c);m[id]=JSON.parse(JSON.stringify(o));write(c,m);emit(c)},
    delete:async()=>{const m=read(c);delete m[id];write(c,m);emit(c)},
    get:async()=>{const m=read(c);return{exists:id in m,data:()=>m[id]}}
   }),
   onSnapshot:f=>{(subs[c]=subs[c]||[]).push(f);setTimeout(()=>emit(c),0);return()=>{subs[c]=subs[c].filter(x=>x!==f)}}
  })};
 }
 function loadScript(src){return new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.append(s)})}
 async function fireDB(){
  const v='10.12.2',b='https://www.gstatic.com/firebasejs/'+v+'/';
  await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-firestore-compat.js');
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore();
  return{collection:c=>({
   doc:id=>({set:o=>fs.collection(c).doc(id).set(JSON.parse(JSON.stringify(o))),delete:()=>fs.collection(c).doc(id).delete(),get:()=>fs.collection(c).doc(id).get()}),
   onSnapshot:f=>fs.collection(c).onSnapshot(f)
  })};
 }
 let dbP;
 window.claude={use:async name=>{
  if(name==='db'){
   if(!dbP)dbP=(async()=>{if(window.FIREBASE_CONFIG){try{return await fireDB()}catch(e){console.error('Firebase gagal, pakai penyimpanan lokal',e)}}return localDB()})();
   return dbP;
  }
  if(name==='downloads')return{save:async({filename,data})=>{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  return null; /* 'sample' (AI) dan 'assets' (upload file) tidak tersedia di luar Claude */
 }};
})();
</script>

 let id=0;const LM=720000,lw=logo?(logo.w>=logo.h?LM:Math.round(LM*logo.w/logo.h)):0,lh=logo?(logo.w>=logo.h?Math.round(LM*logo.h/logo.w):LM):0;

 const W=[500,2300,800,800,700,900,3638],cs=(t,w,o={})=>TC(P(R(t,{b:o.b,sz:o.sz||19}),{jc:o.jc,af:20}),w,o.sh);
 const body=D.map((d,n)=>{
  const kop=TB(TR(TC(logo?P(pic()):'',1300)+TC(P(R(g.sch.toUpperCase(),{b:1,sz:30}),{jc:'center',af:20})+(g.adr?P(R(g.adr,{sz:19}),{jc:'center',af:0}):''),7038)+TC('',1300)),[1300,7038,1300],0);
  const idn=TB([['Nama Siswa',d.name],['Kelas',d.c.name],['Mata Pelajaran',d.c.subject],['Guru Pengampu',my().name]].map(a=>TR(TC(P(R(a[0]),{af:10}),2200)+TC(P(R(':'),{af:10}),300)+TC(P(R(a[1],{b:1}),{af:10}),7138))).join(''),[2200,300,7138],0);
  const nl=TB(TR(['No','Topik','Jenis','Nilai','KKM','Predikat','Deskripsi capaian'].map((t,k)=>cs(t,W[k],{b:1,sh:'E9E9E9',jc:k&&k<6?'center':undefined})).join(''))+(d.rows.map((r,k)=>TR([k+1,r.t,r.tipe,rpV(r.fin),r.kk,r.pred,r.desc].map((t,j)=>cs(String(t),W[j],{b:j===3,jc:j===1||j===6?undefined:'center'})).join(''))).join('')||TR(TC(P(R('Belum ada LKPD atau kuis.',{sz:19})),9638))),W,1);
  const sm=TB(TR([['Nilai akhir semester',rpV(d.f)],['Predikat',d.pl],['KKM',String(d.kk)],['Status',d.st]].map(a=>TC(P(R(a[0],{sz:17}),{jc:'center',af:0})+P(R(a[1],{b:1,sz:22}),{jc:'center',af:20}),2409)).join('')),[2409,2409,2410,2410],1);
  const sg=(t,nm,nip)=>TC(P(R(t,{sz:19}),{jc:'center',af:0})+P('',{af:0,bf:700})+P(R(nm||'..............................',{b:1,u:1,sz:19}),{jc:'center',af:0})+(nip?P(R('NIP. '+nip,{sz:18}),{jc:'center',af:0}):''),3212,'','top');
  const tg=TB(TR(TC('',3213)+TC('',3213)+TC(P(R((g.kota?g.kota+', ':'')+rsmTgl(g),{sz:19}),{jc:'center',af:20}),3212))+TR(sg('Orang Tua/Wali','','')+sg('Kepala Sekolah',g.ks,g.nks)+sg('Guru Mata Pelajaran',my().name,g.nip)),[3213,3213,3212],0);
  return kop+P('',{bd:1,af:100})+P(R('LAPORAN HASIL BELAJAR (RAPOR)',{b:1,sz:26}),{jc:'center',af:0})+P(R(`Semester ${g.sem} · Tahun Ajaran ${d.c.year}`,{sz:21}),{jc:'center',af:140})+idn+P('',{af:60})+nl+P('',{af:60})+sm+P(R('Deskripsi capaian keseluruhan',{b:1,sz:20}),{bf:120,af:20})+P(R(d.sum,{sz:20}))+(d.note?P(R('Catatan guru',{b:1,sz:20}),{bf:60,af:20})+P(R(d.note,{sz:20})):'')+P(R(`Predikat terhadap KKM ${d.kk}: A = Sangat baik (≥ KKM+10) · B = Baik (≥ KKM) · C = Hampir tuntas (KKM−10 sampai di bawah KKM) · D = Perlu bimbingan (di bawah KKM−10).`,{sz:15,c:'666666'}),{bf:60})+P('',{af:100})+tg+(n<D.length-1?'<w:p><w:r><w:br w:type="page"/></w:r></w:p>':'')}).join('');
  zip.file('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');

  if(logo)zip.file('word/media/logo.png',logo.buf);

async function rsmSave(){const u=my(),v=k=>(($('#rsm_'+k)||{}).value||'').trim();await save('users',{...u,rpt:{...(u.rpt||{}),sch:v('sch'),adr:v('adr'),sem:v('sem')||'Ganjil',kota:v('kota'),tgl:v('tgl'),ks:v('ks'),nks:v('nks'),nip:v('nip')}});toast('Pengaturan rapor disimpan ✅')}
async function rsmLogo(el){const f=await upFile(el,['png','jpg','jpeg','webp'],2);if(!f)return;const u=my();await save('users',{...u,rpt:{...(u.rpt||{}),logo:f.id}});el.value='';toast('Logo disimpan ✅')}
async function rsmLogoDel(){const u=my();await save('users',{...u,rpt:{...(u.rpt||{}),logo:''}});toast('Logo dihapus')}
async function rsmNote(){const c=rsmCls();if(!c||rsmS==='all')return;await save('classes',{...c,rn:{...(c.rn||{}),[rsmS]:(($('#rsm_note')||{}).value||'').trim().slice(0,600)}});toast('Catatan guru disimpan ✅')}
const rsmUI=()=>{
 const cs=rpClasses();if(!cs.length)return '';
 const g=rsmCfg(),c=rsmCls(),ids=rpIds(c),e=esc;if(rsmS!=='all'&&!ids.includes(rsmS))rsmS='all';
 const D=rsmList(),inp=(k,l,v,t)=>`<label>${l}</label><input id="rsm_${k}" type="${t||'text'}" value="${e(v)}">`;
 const set=`<details ${rsmOpen?'open':''} ontoggle="rsmOpen=this.open"><summary><b>⚙ Pengaturan rapor (kop sekolah dan tanda tangan)</b></summary>${inp('sch','Nama sekolah',g.sch)}${inp('adr','Alamat / kontak sekolah',g.adr)}<label>Semester</label><select id="rsm_sem"><option ${g.sem==='Ganjil'?'selected':''}>Ganjil</option><option ${g.sem==='Genap'?'selected':''}>Genap</option></select>${inp('kota','Tempat penandatanganan',g.kota)}${inp('tgl','Tanggal rapor (kosong = hari ini)',g.tgl,'date')}${inp('ks','Nama kepala sekolah',g.ks)}${inp('nks','NIP kepala sekolah',g.nks)}${inp('nip','NIP guru',g.nip)}<label>Logo sekolah (PNG/JPG/WEBP, maks 2 MB)</label>${g.logo?`<p><img src="/_blob/${e(g.logo)}" style="height:48px;vertical-align:middle"> <button class="o" onclick="rsmLogoDel()">Hapus logo</button></p>`:''}<input type="file" accept="image/png,image/jpeg,image/webp" onchange="rsmLogo(this)"><p><button onclick="rsmSave()">Simpan pengaturan</button></p></details>`;
 const prev=D.length===1?`<div style="overflow-x:auto;margin-top:8px"><div style="min-width:640px;max-width:794px;margin:auto;padding:24px 28px;background:#fff;border:1px solid var(--bd);border-radius:8px">${rsmPage(D[0],g)}</div></div><label>Catatan guru untuk ${e(D[0].name)} (ikut tercetak di rapor)</label><textarea id="rsm_note" rows="3" maxlength="600">${e(D[0].note)}</textarea><p><button class="o" onclick="rsmNote()">Simpan catatan</button></p>`:`<div style="overflow-x:auto"><table><tr><th>Siswa</th><th>Nilai akhir</th><th>Predikat</th><th>Status</th></tr>${D.map(x=>`<tr><td>${e(x.name)}</td><td>${rpV(x.f)}</td><td>${e(x.pl)}</td><td>${e(x.st)}</td></tr>`).join('')}</table></div><small>Pilih satu siswa untuk melihat pratinjau rapor dan mengisi catatan guru.</small>`;
 return `<div class="card"><h3>🎓 Rapor Semester (siap cetak)</h3>${set}<label>Kelas</label><select onchange="rsmC=this.value;rsmS='all';this.blur();render()">${cs.map(k=>`<option value="${k.id}" ${k.id===c.id?'selected':''}>${e(k.name)}</option>`).join('')}</select><label>Siswa</label><select onchange="rsmS=this.value;this.blur();render()"><option value="all">Semua siswa (${ids.length})</option>${ids.map(id=>`<option value="${id}" ${rsmS===id?'selected':''}>${e(nmOf(id))}</option>`).join('')}</select><p><button onclick="rsmPdf(this)">PDF</button> <button class="o" onclick="rsmDocx(this)">DOCX</button></p><small>Satu siswa per halaman A4: kop sekolah, nilai dan predikat per topik, deskripsi capaian, nilai akhir semester, dan kolom tanda tangan. Nilai diambil dari semua aktivitas yang sudah dipublikasikan di kelas, memakai KKM, bobot, dan metode remedial di Pengaturan Nilai.</small>${prev}</div>`};
